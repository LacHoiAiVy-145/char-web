<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lạc Hồi Ái Vy</title>
    <!-- Font chữ nghệ thuật -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b0b00;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Playfair Display', serif;
            padding: 10px;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng các biểu tượng rơi ở nền */
        .falling-symbol {
            position: fixed;
            top: -20px;
            color: rgba(253, 229, 165, 0.4);
            font-size: 18px;
            pointer-events: none;
            z-index: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Khung trình duyệt bên ngoài (mở rộng hơn) */
        .browser-card {
            width: 100%;
            max-width: 460px;
            background: #8b3a00;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #5a2200;
            position: relative;
            z-index: 10;
        }

        /* Nút cửa sổ trình duyệt */
        .browser-dots {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            padding-left: 6px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        /* Thanh URL */
        .url-bar {
            background: #ab5406;
            color: #ffebad;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 6px;
        }

        .tab-buttons {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            background: #c6782b;
            color: #3d1700;
            border: none;
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #fbe395;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .action-icons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        /* Thẻ nội dung màu kem */
        .content-card {
            background: #fdf5d8;
            border-radius: 28px;
            padding: 30px 15px 35px 15px;
            text-align: center;
            color: #4a1500;
            box-shadow: inset 0 0 10px rgba(139, 58, 0, 0.1);
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Tiêu đề chính */
        .main-title {
            font-family: 'Dancing Script', cursive;
            font-size: 48px;
            line-height: 1.1;
            color: #3b0e00;
            margin-bottom: 12px;
        }

        /* Hoa văn trang trí hoa */
        .flower-divider {
            color: #d89336;
            font-size: 15px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* Nội dung câu thơ */
        .poem-text {
            font-style: italic;
            font-size: 15px;
            line-height: 1.9;
            margin-bottom: 25px;
            color: #3d1500;
            width: 100%;
            word-break: keep-all;
        }

        /* Nút Chạm Vào */
        .action-button {
            background: #fde8a5;
            border: 2px solid #f3cb69;
            color: #4a1500;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s;
        }

        .action-button:active {
            transform: scale(0.96);
        }

        /* Quản lý Tab */
        .tab-panel {
            display: none;
            width: 100%;
        }

        .tab-panel.active {
            display: block;
        }

        #music-player {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Khung trình duyệt -->
    <div class="browser-card">
        <div class="browser-dots">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
        </div>

        <div class="url-bar">
            ✨ https://lachoiaivy-145.github.io/char-web/
        </div>

        <div class="nav-tabs">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('gap-go', this)">Gặp gỡ</button>
                <button class="tab-btn" id="tam-tu-btn" onclick="switchTab('tam-tu', this)">Tâm Tư</button>
                <button class="tab-btn" onclick="switchTab('tho-lo', this)">Thổ lộ</button>
            </div>
            <div class="action-icons">
                <button class="icon-btn" id="music-toggle" onclick="toggleMusic()" title="Bật/Tắt Nhạc">🔇</button>
                <button class="icon-btn" title="Đọc">📖</button>
            </div>
        </div>

        <div class="content-card">
            
            <!-- Trang 1: Gặp gỡ -->
            <div id="gap-go" class="tab-panel active">
                <h1 class="main-title">Lạc Hồi<br>Ái Vy</h1>
                <div class="flower-divider">*.:｡ ✿ *.:｡ ✿ *.:｡</div>
                <div class="poem-text">
                    “Nét đẹp chung quy vẫn là nét đẹp,<br>
                    Bất kể lúc nó úa tàn.<br>
                    Tình yêu của chúng ta chung quy vẫn là tình yêu,<br>
                    Ngay cả khi chúng ta chết đi.”
                </div>
                <button class="action-button" onclick="goToTamTu()">◦*✧ Chạm vào ✧*◦</button>
            </div>

            <!-- Trang 2: Tâm Tư (Trắng) -->
            <div id="tam-tu" class="tab-panel">
            </div>

            <!-- Trang 3: Thổ lộ (Trắng) -->
            <div id="tho-lo" class="tab-panel">
            </div>

        </div>
    </div>

    <!-- Nhạc YouTube -->
    <iframe id="music-player" 
            src="https://www.youtube.com/embed/Mkwn5MHsJa0?enablejsapi=1&loop=1&playlist=Mkwn5MHsJa0" 
            allow="autoplay">
    </iframe>

    <script>
        let isPlaying = false;

        // Tạo hiệu ứng rơi ở nền
        const symbols = ['☆', '✿', '✧', '♡'];
        function createFallingSymbol() {
            const symbol = document.createElement('div');
            symbol.classList.add('falling-symbol');
            symbol.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            symbol.style.left = Math.random() * 100 + 'vw';
            symbol.style.animationDuration = Math.random() * 3 + 4 + 's';
            symbol.style.fontSize = Math.random() * 10 + 14 + 'px';
            document.body.appendChild(symbol);

            setTimeout(() => {
                symbol.remove();
            }, 7000);
        }
        setInterval(createFallingSymbol, 400);

        // Chuyển Tab
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabId).classList.add('active');
            if (btnElement) btnElement.classList.add('active');
        }

        // Bật/Tắt Nhạc
        function playMusic() {
            const iframe = document.getElementById('music-player');
            const icon = document.getElementById('music-toggle');
            iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            icon.textContent = '🔊';
            isPlaying = true;
        }

        function toggleMusic() {
            const iframe = document.getElementById('music-player');
            const icon = document.getElementById('music-toggle');
            
            if (!isPlaying) {
                playMusic();
            } else {
                iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                icon.textContent = '🔇';
                isPlaying = false;
            }
        }

        // Bấm nút Chạm vào -> Phát nhạc & chuyển sang Tâm Tư
        function goToTamTu() {
            if (!isPlaying) {
                playMusic();
            }
            switchTab('tam-tu', document.getElementById('tam-tu-btn'));
        }
    </script>
</body>
</html>
