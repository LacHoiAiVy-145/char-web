<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lạc Hồi Ái Vy</title>
    <!-- Font chữ phong cách cổ điển, nghệ thuật -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* Khung mô phỏng trình duyệt cổ điển */
        .browser-frame {
            width: 100%;
            max-width: 420px;
            background-color: #8c4200;
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid #5d2b00;
        }

        /* Thanh địa chỉ URL giả */
        .url-bar {
            background-color: #6a3100;
            border-radius: 20px;
            padding: 6px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            color: #e6c387;
            font-size: 13px;
            border: 1px solid #4a2200;
            gap: 8px;
        }

        .url-bar span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Dot ba màu góc trái */
        .dots {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            padding-left: 5px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        /* Thanh Menu 3 tab */
        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            align-items: center;
        }

        .tab {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .tab.active {
            background-color: #e69d35;
            color: #3b1e00;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        .tab.inactive {
            background-color: #572900;
            color: #d1a36a;
        }

        .audio-icons {
            margin-left: auto;
            display: flex;
            gap: 8px;
            color: #d1a36a;
            font-size: 14px;
        }

        /* Tấm thiệp chính */
        .card {
            background-color: #fcf4d9;
            border: 2px solid #e0c896;
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(184, 134, 11, 0.15);
        }

        /* Tiêu đề Lạc Hồi Ái Vy */
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            color: #3a1700;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .divider {
            color: #b8860b;
            letter-spacing: 3px;
            font-size: 12px;
            margin: 15px 0 25px 0;
        }

        /* Bài thơ / Trích dẫn */
        .quote {
            color: #3a1700;
            font-style: italic;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* Nút Chạm vào */
        .btn-touch {
            display: inline-block;
            width: 80%;
            padding: 10px 0;
            background-color: #ffffff;
            border: 2px solid #e0b86c;
            border-radius: 25px;
            color: #3a1700;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        /* Chữ hướng dẫn bên dưới */
        .subtext {
            font-size: 12px;
            color: #8c6d3f;
            font-style: italic;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="browser-frame">
        <!-- Chấm tròn trang trí -->
        <div class="dots">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
        </div>

        <!-- Thanh địa chỉ Web -->
        <div class="url-bar">
            <span>✨ https://lachoiaivy-145.github.io/char-web/</span>
        </div>

        <!-- Menu 3 tab -->
        <div class="nav-tabs">
            <div class="tab active">Gặp gỡ</div>
            <div class="tab inactive">Tâm Tư</div>
            <div class="tab inactive">Thổ lộ</div>
            <div class="audio-icons">
                <span>🔊</span>
                <span>📖</span>
            </div>
        </div>

        <!-- Tấm Thiệp Nội Dung -->
        <div class="card">
            <h1 class="title">Lạc Hồi<br>Ái Vy</h1>
            
            <div class="divider">*.:｡ ✿ *.:｡ ✿ *.:｡</div>

            <div class="quote">
                “Nét đẹp chung quy vẫn là nét đẹp,<br>
                Bất kể lúc nó úa tàn.<br>
                Tình yêu của chúng ta chung quy vẫn là tình yêu,<br>
                Ngay cả khi chúng ta chết đi.”
            </div>

            <a href="#" class="btn-touch">◦*✧ Chạm vào ✧*◦</a>

        </div>
    </div>

</body>
</html>
